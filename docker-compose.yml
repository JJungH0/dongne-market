services:
  postgres:
    image: imresamu/postgis:17-3.5-alpine   # arm64(Apple Silicon) 지원. x86은 postgis/postgis:17-3.5 도 가능
    container_name: dongne-postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: dongne
      POSTGRES_USER: dongne
      POSTGRES_PASSWORD: dongne
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dongne -d dongne"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dongne-redis
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
