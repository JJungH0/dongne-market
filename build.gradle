plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.dongne'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	springdocVersion = '3.1.1'
}

dependencies {
	/**
	 * 웹 / 영속성
	 */
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'

	/**
	 * 인증 : Spring Security + 자체 발급 JWT (HMAC)
	 */
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	/**
	 * 실시간 채팅 : WebSocket + STOMP
	 */
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	/**
	 * 캐시 / 조회수 : Redis
	 */
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-cache'

	/**
	 * 관측성 / 문서
	 */
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	/**
	 * 테스트
	 */
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events 'failed', 'skipped'
		exceptionFormat 'full'
	}
}

/**
 * 프론트엔드(Vite) 빌드 → static. bootJar / bootRun 때만 실행.
 */
tasks.register('frontendInstall', Exec) {
	workingDir 'frontend'
	commandLine 'npm', 'ci'
	inputs.file 'frontend/package-lock.json'
	outputs.dir 'frontend/node_modules'
}
tasks.register('frontendBuild', Exec) {
	dependsOn 'frontendInstall'
	workingDir 'frontend'
	commandLine 'npm', 'run', 'build'
	inputs.dir 'frontend/src'
	inputs.files 'frontend/index.html', 'frontend/vite.config.ts', 'frontend/package.json'
	outputs.dir 'src/main/resources/static'
}
tasks.named('processResources') { mustRunAfter 'frontendBuild' }
tasks.named('bootJar') { dependsOn 'frontendBuild' }
tasks.named('bootRun') { dependsOn 'frontendBuild' }
